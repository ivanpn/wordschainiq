<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цепочка слов</title>
<meta name="description" content="Игра в слова: каждое следующее слово начинается на последнюю букву предыдущего. Слова, города и персонажи, на русском и английском.">
<meta property="og:type" content="website">
<meta property="og:title" content="Цепочка слов">
<meta property="og:description" content="Сыграем в слова? Каждое следующее слово начинается на последнюю букву предыдущего.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1530" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23DCE7FA'/%3E%3Crect x='5' y='11' width='14' height='10' rx='5' fill='none' stroke='%233A6AD4' stroke-width='2.4'/%3E%3Crect x='13' y='11' width='14' height='10' rx='5' fill='none' stroke='%23DE5B45' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --bg: #FFFFFF; --bg-soft: #F4F7FD; --card: #FFFFFF;
  --wash: #DCE7FA; --wash-strong: #C6D7F6;
  --line: #3A6AD4; --ink: #1C2A57; --muted: #5C6990; --faint: #8C97B6; --border: #DCE4F3;
  --coral: #D9533D; --coral-wash: #FBE0D9; --orange: #EE9D4E; --orange-wash: #FCE6D0;
  --green: #4DBF8B; --green-wash: #D7F2E5; --blue: #7DA3EE; --blue-wash: #DDE8FB;
  --violet: #9B7BE0; --violet-wash: #E9E1FA; --slate: #8A9BC0; --slate-wash: #E1E7F2;
  --btn: #2F5FD0; --btn-ink: #FFFFFF; --scrim: rgba(20, 32, 70, .38);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1530; --bg-soft: #111B3B; --card: #121C3E;
    --wash: #1A2A55; --wash-strong: #24376B;
    --line: #8EB0F6; --ink: #EAF0FF; --muted: #A4B2D8; --faint: #7383AD; --border: #24345F;
    --coral: #FF8B74; --coral-wash: #43263A; --orange: #F5A964; --orange-wash: #3E2F2E;
    --green: #67D7A2; --green-wash: #173D3B; --blue: #6F93E3; --blue-wash: #1D2E5C;
    --violet: #AD93EE; --violet-wash: #2C2756; --slate: #8899C0; --slate-wash: #1F2B4D;
    --btn: #8EB0F6; --btn-ink: #0D1530; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1530; --bg-soft: #111B3B; --card: #121C3E;
  --wash: #1A2A55; --wash-strong: #24376B;
  --line: #8EB0F6; --ink: #EAF0FF; --muted: #A4B2D8; --faint: #7383AD; --border: #24345F;
  --coral: #FF8B74; --coral-wash: #43263A; --orange: #F5A964; --orange-wash: #3E2F2E;
  --green: #67D7A2; --green-wash: #173D3B; --blue: #6F93E3; --blue-wash: #1D2E5C;
  --violet: #AD93EE; --violet-wash: #2C2756; --slate: #8899C0; --slate-wash: #1F2B4D;
  --btn: #8EB0F6; --btn-ink: #0D1530; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2.5px solid var(--line); outline-offset: 2px; }
[hidden] { display: none !important; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.app { height: 100%; }
.screen { height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.wrap { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 20px 44px; }
.eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--coral); }
.note { margin: 8px 0; max-width: 46ch; font-size: 15px; color: var(--muted); }
.note.small { font-size: 14px; min-height: 1.3em; }
.label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--muted); }
.muted { color: var(--muted); }
h2 { margin: 10px 0 6px; font-size: 30px; font-weight: 300; line-height: 1.2; letter-spacing: -.01em; }

/* bars */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 760px; margin: 0 auto; padding: 10px 20px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
.logo svg { width: 30px; height: 30px; }
.bar-right { display: flex; align-items: center; gap: 4px; }
.lang { display: inline-flex; padding: 3px; border: 1.5px solid var(--border); border-radius: 999px; }
.lang button { min-width: 42px; min-height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: none; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--wash); color: var(--ink); }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.gbar { flex: none; display: flex; align-items: center; gap: 6px; min-height: 58px; padding: 6px 16px 6px 6px; border-bottom: 1.5px solid var(--border); }
.gtitle { font-size: 17px; font-weight: 600; }
.gbox { flex: 1; min-width: 0; display: grid; }
.gbox .eyebrow { margin: 0; font-size: 11px; }
.gstat { display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 15px; color: var(--muted); }
.gstat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* hero */
.hero { display: grid; gap: 6px; padding: 8px 0 4px; }
.hero h1 { margin: 0; max-width: 15ch; font-size: clamp(30px, 7.4vw, 44px); font-weight: 300; line-height: 1.14; letter-spacing: -.015em; }
.hero-art svg { display: block; width: 100%; max-width: 460px; height: auto; margin: 0 auto; }
@media (min-width: 720px) { .hero { grid-template-columns: 1.05fr 1fr; align-items: center; gap: 24px; padding-top: 24px; } }
.block { margin-top: 28px; }

/* modes */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 440px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mode { position: relative; display: grid; align-content: start; justify-items: start; gap: 2px; min-height: 134px; padding: 12px 12px 14px; border: 1.5px solid var(--border); border-radius: 18px; background: var(--card); color: var(--ink); text-align: left; }
.mode svg { width: 46px; height: 46px; margin-bottom: 6px; }
.mode b { font-size: 15.5px; font-weight: 600; }
.mode small { font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.mode[aria-pressed="true"] { border-color: var(--line); background: var(--bg-soft); box-shadow: inset 0 0 0 1px var(--line); }
.mode.locked b { color: var(--muted); }
.mode.locked svg { opacity: .6; }
.tag { position: absolute; top: 11px; right: 11px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--coral); }

/* ways to play */
.plays { display: grid; gap: 10px; }
.play { display: flex; align-items: center; gap: 14px; min-height: 70px; padding: 10px 16px 10px 12px; border: 1.5px solid var(--border); border-radius: 18px; background: var(--card); color: var(--ink); text-align: left; }
.play .pi { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--wash); }
.play .pi svg { width: 40px; height: 40px; }
.play b { display: block; font-size: 16.5px; font-weight: 600; }
.play small { display: block; font-size: 13.5px; color: var(--muted); }
.play.primary { border-color: var(--btn); background: var(--btn); color: var(--btn-ink); }
.play.primary small { color: inherit; opacity: .82; }
.play.primary .pi { background: var(--card); }
.play:active, .btn:active { transform: translateY(1px); }

/* settings */
.setting { display: grid; justify-items: start; gap: 6px; margin-top: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1.5px solid var(--border); border-radius: 14px; }
.seg button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 11px; background: none; font-size: 14.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }

/* teaser, rules */
.teaser { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 14px 16px; border-radius: 18px; background: var(--bg-soft); }
.teaser p { margin: 0; font-size: 15px; color: var(--muted); }
.teaser b { color: var(--ink); }
.linkbtn { padding: 6px 0; border: 0; background: none; color: var(--line); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.linkbtn.small { padding: 4px 0; font-size: 14px; font-weight: 500; color: var(--muted); }
.rules { max-width: 62ch; margin-top: 24px; }
.rules summary { padding: 6px 0; font-weight: 600; cursor: pointer; }
.rules p { margin: 8px 0; font-size: 15px; color: var(--muted); }
.credits { max-width: 72ch; margin-top: 18px; font-size: 12px; color: var(--faint); }

/* forms */
.btn { min-height: 50px; padding: 0 20px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--card); color: var(--ink); font-size: 16px; font-weight: 600; }
.btn.primary { border-color: var(--btn); background: var(--btn); color: var(--btn-ink); }
.btn.wide { width: 100%; max-width: 380px; margin-top: 12px; }
.field { display: grid; max-width: 380px; margin: 16px 0 6px; }
.field input, .linkbox input, .plist input {
  width: 100%; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 14px;
  background: var(--card); color: var(--ink); font-size: 17px; outline: none;
}
.field input:focus, .linkbox input:focus, .plist input:focus, #wordInput:focus { border-color: var(--line); box-shadow: 0 0 0 3px var(--wash); }
.linkbox { display: flex; gap: 8px; max-width: 480px; }
.linkbox input { font-size: 14px; }
.linkbox .btn { flex: none; min-height: 48px; padding: 0 14px; font-size: 15px; }
.plist { display: grid; gap: 8px; max-width: 440px; margin: 14px 0 6px; padding: 0; list-style: none; }
.plist li { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.plist .av { width: 44px; height: 44px; }
.plist .pname { font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.you { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--wash); color: var(--muted); font-size: 12px; font-weight: 600; vertical-align: middle; }

/* game */
.players { flex: none; display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; border-bottom: 1.5px solid var(--border); scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.pl { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.pl .av { width: 28px; height: 28px; }
.pl .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.pl.cur { background: var(--wash); }
.pl.out .nm { opacity: .55; text-decoration: line-through; text-decoration-color: var(--coral); }
.chain { flex: 1; min-height: 0; margin: 0; padding: 12px 16px 20px; overflow-y: auto; overscroll-behavior: contain; list-style: none; }
.mv { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 7px 0; }
.mv::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; border-left: 2px dashed var(--wash-strong); }
.mv:first-child::before { top: 50%; }
.mv:last-child::before { bottom: 50%; }
.mv:only-child::before { display: none; }
.mv .av { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--bg); }
.mv .w { display: grid; min-width: 0; }
.mv .who { font-size: 12px; font-weight: 500; line-height: 1.2; color: var(--faint); }
.mv .word { font-size: 24px; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.mv.comp .word { color: var(--muted); }
.mv .dt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mv.note .word { font-size: 15px; font-weight: 500; color: var(--coral); }
.mv.new { animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.hl { padding: 0 .05em; border-radius: 42% 58% 46% 54% / 56% 44% 56% 44%; background: var(--coral-wash); }
.hl.b { background: var(--wash-strong); }
.skip { color: var(--faint); }
.forced { margin-left: 3px; color: var(--coral); }
.empty { padding: 14px 0 0 4px; font-size: 16px; color: var(--muted); }
.dock { position: relative; flex: none; padding: 12px 16px; border-top: 1.5px solid var(--border); background: var(--bg); }
.timebar { position: absolute; left: 0; right: 0; top: -1.5px; height: 3px; background: var(--line); transform-origin: left center; }
.timebar.low { background: var(--coral); }
.timebar.idle { opacity: .25; transform: none !important; }
.timebar.off { opacity: 0; }
.timebar.smooth { transition: transform .25s linear; }
.dock-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.cell { position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
.cell .blob { position: absolute; inset: 0; border-radius: 44% 56% 52% 48% / 54% 46% 54% 46%; background: var(--seat-wash, var(--wash)); }
.cell .big { position: relative; font-size: 30px; font-weight: 600; }
.cell .big.any { font-size: 15px; }
.cell .secs { position: absolute; right: -6px; bottom: -6px; min-width: 26px; padding: 1px 6px; border: 1.5px solid var(--border); border-radius: 999px; background: var(--bg); font-size: 11px; font-weight: 600; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .secs:empty { display: none; }
.cell.low .secs { border-color: var(--coral); color: var(--coral); }
.cell.thinking .big { animation: think 1s ease-in-out infinite; }
@keyframes think { 50% { opacity: .35; } }
#wordInput { width: 100%; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--card); color: var(--ink); font-size: 20px; font-weight: 500; outline: none; }
#wordInput::placeholder { font-size: 16px; font-weight: 400; color: var(--faint); }
#moveBtn[aria-disabled="true"] { opacity: .45; }
.dock-meta { display: flex; align-items: baseline; gap: 12px; min-height: 26px; margin-top: 8px; }
.feedback { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; color: var(--muted); }
.feedback .bad { margin-right: 4px; font-weight: 600; color: var(--coral); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.feedback .accept { margin-left: 6px; padding: 2px 10px; border: 1.5px solid var(--coral); border-radius: 999px; background: none; color: var(--coral); font-size: 13px; font-weight: 600; }
.shake { animation: shake .26s linear; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet-card { width: min(560px, 100%); max-height: calc(100% - env(safe-area-inset-top, 0px) - 20px); overflow-y: auto; padding: 20px 22px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0; background: var(--bg); animation: up .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes up { from { opacity: 0; transform: translateY(30px); } }
@media (min-width: 640px) { .sheet { align-items: center; } .sheet-card { border-radius: 24px; } }
.sheet-art { display: flex; justify-content: center; }
.sheet-art svg { width: 128px; height: 128px; }
.sheet-card h2 { margin-top: 2px; }
.count { margin: 0; font-size: 42px; font-weight: 300; line-height: 1.1; }
.facts { margin: 14px 0; padding: 0; }
.facts div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1.5px dashed var(--border); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.facts dd small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.ideas b { font-weight: 600; }
.sheet-card .actions { display: grid; gap: 10px; margin-top: 18px; }

/* stats */
.chart svg { display: block; width: 100%; height: auto; }
.recent { margin: 8px 0; padding: 0; list-style: none; }
.recent li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1.5px dashed var(--border); font-size: 14.5px; }
.recent .d { color: var(--faint); font-variant-numeric: tabular-nums; }
.recent .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.empty-art { display: flex; justify-content: center; margin-top: 24px; }
.empty-art svg { width: 150px; height: 150px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs id="defs">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>
  <filter id="wc" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="10"/><feGaussianBlur stdDeviation="0.7"/></filter>
</defs></svg>

<div class="app">
  <section class="screen" id="home">
    <div class="scroll">
      <header class="bar">
        <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--wash)"/><rect x="5" y="11" width="14" height="10" rx="5" fill="none" stroke="var(--line)" stroke-width="2.2"/><rect x="13" y="11" width="14" height="10" rx="5" fill="none" stroke="var(--coral)" stroke-width="2.2"/></svg><span data-i18n="title"></span></div>
        <div class="bar-right">
          <div class="lang" role="group" data-i18n-aria="langLabel"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
          <button class="icon-btn" type="button" id="statsBtn" data-i18n-aria="statsTitle"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 18V11M11 18V5M17 18v-4"/></svg></button>
        </div>
      </header>
      <main class="wrap">
        <section class="hero">
          <div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="headline"></h1></div>
          <div class="hero-art" id="heroArt"></div>
        </section>
        <section class="block" aria-labelledby="modesTitle">
          <p class="eyebrow" id="modesTitle" data-i18n="modesTitle"></p>
          <div class="modes" id="modes"></div>
        </section>
        <section class="block" aria-labelledby="playTitle">
          <p class="eyebrow" id="playTitle" data-i18n="playTitle"></p>
          <div class="plays">
            <button class="play primary" type="button" id="soloBtn"><span class="pi" id="piSolo"></span><span><b data-i18n="playSolo"></b><small data-i18n="playSoloSub"></small></span></button>
            <button class="play" type="button" id="netBtn"><span class="pi" id="piNet"></span><span><b data-i18n="playNet"></b><small data-i18n="playNetSub"></small></span></button>
            <button class="play" type="button" id="groupBtn"><span class="pi" id="piGroup"></span><span><b data-i18n="playGroup"></b><small data-i18n="playGroupSub"></small></span></button>
          </div>
          <p class="note small" id="playNote" aria-live="polite"></p>
        </section>
        <section class="block">

    if (!e.target.closest('#acceptBtn')) return;
    const w = S.pendingForce;
    if (!w || S.over || S.mode !== 'group' || sheetMode) return;
    const k = keyOf(w, S.D.lg);
    if (!k || (S.need && k[0] !== S.need) || S.used.has('k' + k)) return;
    inputEl.value = '';
    accept({ word: w }, true);
  });
  sheetCard.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    if (act === 'again') { if (S.mode === 'online') netRematch(); else newGame(S.mode, S.D); }
    else if (act === 'menu') { if (S.mode === 'online') netLeave(); else goHome(); }
    else if (act === 'leave') netLeave();
    else if (act === 'resume') resumeFromSheet();
    else if (act === 'close') closeSheet();
  });
  sheetEl.addEventListener('click', (e) => {
    if (e.target !== sheetEl) return;
    if (sheetMode === 'quit') resumeFromSheet();
    else if (sheetMode === 'stub' || sheetMode === 'info') closeSheet();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (sheetMode === 'quit') resumeFromSheet();
    else if (sheetMode === 'stub' || sheetMode === 'info') closeSheet();
  });
  document.addEventListener('visibilitychange', () => {
    if (S.mode !== 'solo' && S.mode !== 'group') return;
    if (document.hidden) pauseTimer();
    else if (!sheetMode && !S.over) resumeTimer();
  });
  $('netGo').addEventListener('click', netGo);
  $('nickInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); netGo(); } });
  $('netStart').addEventListener('click', netStartGame);
  $('copyBtn').addEventListener('click', copyInvite);
  $('shareBtn').addEventListener('click', () => {
    navigator.share({ title: t('title'), text: t('shareText'), url: inviteLink() }).catch((e) => { if (!e || e.name !== 'AbortError') copyInvite(); });
  });
  $('onlineBack').addEventListener('click', () => { if (NET.room) netLeave(); else { clearHash(); goHome(); } });
  $('netNew').addEventListener('click', () => { clearHash(); netOpen('create'); });
  $('netHome').addEventListener('click', () => { clearHash(); goHome(); });
  window.addEventListener('hashchange', checkHash);
  let offTimer = 0;
  window.addEventListener('chain-net', (e) => {
    clearTimeout(offTimer);
    if (e.detail) { if (feedbackEl.textContent === t('offline')) clearFeedback(); }
    else offTimer = setTimeout(() => { if (S.mode === 'online') showInfo(t('offline')); }, 2500);
  });

  injectSymbols();
  applyI18n();
  renderHome();
  checkHash();
  setTimeout(() => { ensureDict(settings.lang, settings.mode).catch(() => {}); }, 0);

  if (window.__CHAIN_TEST__) window.__chain = { S: S, NET: NET, DICT: DICT, ensureDict: ensureDict, settings: settings, check: check, pickItem: pickItem, keyOf: keyOf };
})();
</script>
</body>
</html>
